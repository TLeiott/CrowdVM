# crowdvm-server on a small always-on machine (e.g. a Raspberry Pi 5).
# See docs/guide/server-on-a-pi.md.
services:
  crowdvm-server:
    build:
      context: .
      args:
        VERSION: ${CROWDVM_VERSION:-}
    image: crowdvm-server
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      # Snapshots and images live here: keep it on an SSD, not the SD card.
      # Default: a named volume (Docker's data root). A host path in
      # CROWDVM_DATA must belong to uid 65532 (chown 65532:65532 <dir>).
      - ${CROWDVM_DATA:-crowdvm-data}:/data
    environment:
      # Go collects garbage harder before the heap reaches this: steady memory.
      GOMEMLIMIT: 600MiB
      # 1 (default here): sandbox internet traffic leaves through each node, so
      # the Pi does not carry it. 0: it leaves through this server, which keeps
      # node owners' IPs out of it (docs/guide/security.md#the-sandboxs-network).
      CROWDVM_NODE_EGRESS: ${CROWDVM_NODE_EGRESS:-1}
    mem_limit: 1g
    command:
      - serve
      - --listen=:8420
      - --public-url=${CROWDVM_PUBLIC_URL:?set CROWDVM_PUBLIC_URL, e.g. http://192.168.1.10:8420}

volumes:
  crowdvm-data:
