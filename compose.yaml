# crowdvm-server on a small always-on machine (e.g. a Raspberry Pi 5).
# See docs/guide/server-on-a-pi.md.
services:
  crowdvm-server:
    build:
      context: .
      args:
        VERSION: ${CROWDVM_VERSION:-}
    image: crowdvm-server
    restart: unless-stopped
    # Host networking: the server sees real client addresses (rate limits,
    # public URL rules) and the host's own networks (egress checks).
    network_mode: host
    # Lets in-flight requests and the usage flush finish on docker stop.
    stop_grace_period: 30s
    volumes:
      # Snapshots and images live here: keep it on an SSD, not the SD card.
      # Default: a named volume (Docker's data root). A host path in
      # CROWDVM_DATA must belong to uid 65532 (chown 65532:65532 <dir>).
      - ${CROWDVM_DATA:-crowdvm-data}:/data
    environment:
      # Go collects garbage harder before the heap reaches this: steady memory.
      GOMEMLIMIT: 600MiB
      # 1: sandbox internet traffic leaves through each node, so the Pi does not
      # carry it, but node owners then see it and it shows their address.
      # 0 (default): it leaves through this server
      # (docs/guide/security.md#the-sandboxs-network).
      CROWDVM_NODE_EGRESS: ${CROWDVM_NODE_EGRESS:-0}
    mem_limit: 1g
    command:
      - serve
      - --listen=:8420
      - --public-url=${CROWDVM_PUBLIC_URL:?set CROWDVM_PUBLIC_URL, e.g. http://192.168.1.10:8420}

volumes:
  crowdvm-data:
